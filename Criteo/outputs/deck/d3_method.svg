<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="45" y="40" width="290" height="200" rx="14" fill="white" stroke="#52514e" stroke-width="2"/><circle cx="85" cy="86" r="20" fill="#52514e"/><text x="85" y="93" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle"><tspan x="85" dy="0.0">1</tspan></text><text x="117" y="94" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="117" dy="0.0">Coin-flip data</tspan></text><text x="71" y="152" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="71" dy="0.0">14M users; who could see</tspan><tspan x="71" dy="24.7">ads was decided at random</tspan></text><line x1="341" y1="140.0" x2="379" y2="140.0" stroke="#52514e" stroke-width="2.5" marker-end="url(#head)"/><rect x="385" y="40" width="290" height="200" rx="14" fill="white" stroke="#52514e" stroke-width="2"/><circle cx="425" cy="86" r="20" fill="#52514e"/><text x="425" y="93" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle"><tspan x="425" dy="0.0">2</tspan></text><text x="457" y="94" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="457" dy="0.0">Learn visit chance</tspan></text><text x="411" y="152" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="411" dy="0.0">for every user, with the</tspan><tspan x="411" dy="24.7">ad and without it</tspan></text><line x1="681" y1="140.0" x2="719" y2="140.0" stroke="#52514e" stroke-width="2.5" marker-end="url(#head)"/><rect x="725" y="40" width="290" height="200" rx="14" fill="white" stroke="#52514e" stroke-width="2"/><circle cx="765" cy="86" r="20" fill="#52514e"/><text x="765" y="93" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle"><tspan x="765" dy="0.0">3</tspan></text><text x="797" y="94" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="797" dy="0.0">Estimate ad effect</tspan></text><text x="751" y="152" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="751" dy="0.0">the difference between</tspan><tspan x="751" dy="24.7">the two chances</tspan></text><line x1="1021" y1="140.0" x2="1059" y2="140.0" stroke="#52514e" stroke-width="2.5" marker-end="url(#head)"/><rect x="1065" y="40" width="290" height="200" rx="14" fill="#e4eefb" stroke="#2a78d6" stroke-width="3"/><circle cx="1105" cy="86" r="20" fill="#2a78d6"/><text x="1105" y="93" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle"><tspan x="1105" dy="0.0">4</tspan></text><text x="1137" y="94" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="1137" dy="0.0">Rank and target</tspan></text><text x="1091" y="152" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="1091" dy="0.0">show ads to the users</tspan><tspan x="1091" dy="24.7">the ad changes most</tspan></text><text x="45" y="320" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="45" dy="0.0">How the users were used, so the results are fair:</tspan></text><rect x="46" y="344" width="914.9999999999999" height="64" rx="8" fill="#b4b2a9"/><text x="503.49999999999994" y="384" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b0b0b" text-anchor="middle"><tspan x="503.49999999999994" dy="0.0">70%</tspan></text><text x="503.49999999999994" y="444" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="middle"><tspan x="503.49999999999994" dy="0.0">Learn</tspan></text><rect x="962.9999999999999" y="344" width="194.5" height="64" rx="8" fill="#e4eefb"/><text x="1060.25" y="384" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b0b0b" text-anchor="middle"><tspan x="1060.25" dy="0.0">15%</tspan></text><text x="1060.25" y="444" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="middle"><tspan x="1060.25" dy="0.0">Compare</tspan><tspan x="1060.25" dy="24.7">approaches</tspan></text><rect x="1159.5" y="344" width="194.5" height="64" rx="8" fill="#52514e"/><text x="1256.75" y="384" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle"><tspan x="1256.75" dy="0.0">15%</tspan></text><text x="1256.75" y="444" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="middle"><tspan x="1256.75" dy="0.0">Final check,</tspan><tspan x="1256.75" dy="24.7">opened once</tspan></text><text x="45" y="530" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x=