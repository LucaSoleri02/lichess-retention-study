<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="588.0" y="48" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b0b0b" text-anchor="middle"><tspan x="588.0" dy="0.0">Without the ad, would they visit?</tspan></text><text x="415.0" y="104" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#52514e" text-anchor="middle"><tspan x="415.0" dy="0.0">No</tspan></text><text x="761.0" y="104" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#52514e" text-anchor="middle"><tspan x="761.0" dy="0.0">Yes</tspan></text><text x="70" y="348.0" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b0b0b" text-anchor="middle" transform="rotate(-90 70 348.0)"><tspan x="70" dy="0.0">With the ad, would they visit?</tspan></text><text x="226" y="242.0" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#52514e" text-anchor="end"><tspan x="226" dy="0.0">Yes</tspan></text><text x="226" y="468.0" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#52514e" text-anchor="end"><tspan x="226" dy="0.0">No</tspan></text><rect x="250" y="130" width="330" height="210" rx="14" fill="#e4eefb" stroke="#2a78d6" stroke-width="3"/><text x="276" y="180" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="276" dy="0.0">Persuadables</tspan></text><text x="276" y="220" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="276" dy="0.0">Visit only because</tspan><tspan x="276" dy="26.0">they saw the ad</tspan></text><text x="276" y="314" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="276" dy="0.0">→ Worth paying for</tspan></text><rect x="596" y="130" width="330" height="210" rx="14" fill="#fdeae2" stroke="#eb6834" stroke-width="3"/><text x="622" y="180" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="622" dy="0.0">Sure things</tspan></text><text x="622" y="220" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="622" dy="0.0">Visit either way</tspan></text><text x="622" y="314" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="622" dy="0.0">→ Spend wasted</tspan></text><rect x="250" y="356" width="330" height="210" rx="14" fill="#f2f1ed" stroke="#c9c7c0" stroke-width="2"/><text x="276" y="406" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="276" dy="0.0">Lost causes</tspan></text><text x="276" y="446" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="276" dy="0.0">Never visit</tspan></text><text x="276" y="540" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="276" dy="0.0">→ Spend wasted</tspan></text><rect x="596" y="356" width="330" height="210" rx="14" fill="#f2f1ed" stroke="#c9c7c0" stroke-width="2"/><text x="622" y="406" font-