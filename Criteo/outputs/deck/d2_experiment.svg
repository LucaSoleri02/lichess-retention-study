<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="200" width="250" height="120" rx="14" fill="#f2f1ed" stroke="#c9c7c0" stroke-width="2"/><text x="165" y="250" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b0b0b" text-anchor="middle"><tspan x="165" dy="0.0">14 million</tspan></text><text x="165" y="284" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="middle"><tspan x="165" dy="0.0">users</tspan></text><line x1="292" y1="260" x2="372" y2="260" stroke="#52514e" stroke-width="2.5" marker-end="url(#head)"/><circle cx="440" cy="260" r="64" fill="white" stroke="#52514e" stroke-width="2.5"/><text x="440" y="254" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b0b0b" text-anchor="middle"><tspan x="440" dy="0.0">Coin</tspan></text><text x="440" y="282" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b0b0b" text-anchor="middle"><tspan x="440" dy="0.0">Flip</tspan></text><line x1="500" y1="236" x2="592" y2="150" stroke="#52514e" stroke-width="2.5" marker-end="url(#head)"/><line x1="500" y1="284" x2="592" y2="370" stroke="#52514e" stroke-width="2.5" marker-end="url(#head)"/><rect x="600" y="70" width="430" height="150" rx="14" fill="white" stroke="#52514e" stroke-width="2.5"/><text x="628" y="118" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="628" dy="0.0">85% could be shown ads</tspan></text><text x="628" y="162" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="628" dy="0.0">Visited: 4.85%</tspan></text><rect x="600" y="300" width="430" height="150" rx="14" fill="#f2f1ed" stroke="#c9c7c0" stroke-width="2"/><text x="628" y="348" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="628" dy="0.0">15% held out, never shown ads</tspan></text><text x="628" y="392" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="628" dy="0.0">Visited: 3.82%</tspan></text><line x1="1032" y1="145" x2="1072" y2="220" stroke="#52514e" stroke-width="2.5" marker-end="url(#head)"/><line x1="1032" y1="375" x2="1072" y2="300" stroke="#52514e" stroke-width="2.5" marker-end="url(#head)"/><rect x="1080" y="170" width="300" height="180" rx="14" fill="#e4eefb" stroke="#2a78d6" stroke-width="3"/><text x="1104" y="214" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="21" font-weight="normal" fill="#0b0b0b" text-anchor="start"><tspan x="1104" dy="0.0">The difference is</tspan><tspan x="1104" dy="27.3">what the ads cause</tspan></text><text x="1104" y="290" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0b0b0b" text-anchor="start"><tspan x="1104" dy="0.0">+1.03 points</tspan></text><text x="1104" y="324" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="1104" dy="0.0">+27% more visits</tspan></text><text x="40" y="490" font-family="Inter, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="19" font-weight="normal" fill="#52514e" text-anchor="start"><tspan x="40" dy="0.0">The coin flip makes the two groups alike in every way except the ads, so the gap in visits is caused by the ads.</tspan></text></svg>